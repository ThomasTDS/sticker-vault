plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def reactNativeArchitectures() {
  def value = project.findProperty("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"]
}

group = 'com.thomastds'
version = '0.1.0'

android {
  namespace "com.thomastds.stickermaker"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
    // Same architectures as React Native (gradle.properties), so CI can build only the emulator's.
    ndk {
      abiFilters(*reactNativeArchitectures())
    }
  }
  // Animated stickers: libwebp's animation encoder, compiled with the NDK (see CMakeLists.txt).
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }
}

dependencies {
  // On-device subject segmentation; the model is delivered by Google Play services.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
  // ModuleInstall API, used to check and request the model download.
  implementation 'com.google.android.gms:play-services-base:18.5.0'
}
