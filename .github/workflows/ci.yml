name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same pull request cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  CMAKE_VERSION: 3.31.6
  EMULATOR_API_LEVEL: 34

jobs:
  typecheck:
    name: Verificação de tipos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            e2e/package-lock.json

      - name: App (mobile)
        working-directory: mobile
        run: |
          npm ci
          npm run typecheck

      - name: Testes (e2e)
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck

  android:
    name: Build Android e testes e2e
    needs: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            e2e/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # The project pins CMake 3.31.6 (see mobile/plugins/with-cmake-version.js).
      - name: Instalar CMake do Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;${CMAKE_VERSION}" > /dev/null

      - name: Instalar dependências
        run: |
          npm ci --prefix mobile
          npm ci --prefix e2e

      - name: Gerar o APK de release
        working-directory: mobile
        run: |
          npm run prebuild
          cd android
          ./gradlew assembleRelease

      - name: Publicar o APK
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # Hardware acceleration for the Android emulator on Linux runners.
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Rodar os testes e2e no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: google_apis
          arch: x86_64
          # No device profile: the runner's avdmanager fails to create the AVD with "pixel_6" (hwMap is null).
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd e2e && npm test

      - name: Publicar o relatório dos testes
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Resultado dos testes e2e
          path: e2e/reports/junit/*.xml
          reporter: java-junit
          fail-on-empty: false

      - name: Publicar capturas de tela e logs do Appium
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostico
          path: |
            e2e/reports/
            e2e/logs/
          retention-days: 7
